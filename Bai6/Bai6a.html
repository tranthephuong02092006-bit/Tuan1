<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Registration Form</title>
        <style>
            .container{
                text-align: center;
            }
            .logo{
                width: 450px;
                height: 120px;
            }
            table{
                margin: 0 auto;
                width: 600px;
            }
            hr{
                width: 592px;
                border: 1px solid black;
            }
            .box{
                border: 2px solid rgb(30, 179, 127);
                padding: 20px;
                width: fit-content;   
                margin: 20px auto;    
                background-color:rgb(37, 123, 180); 
                }
            
            
        </style>
    </head>
    <body>
    <div class="box">
        <div class="container">
            <img src="logo(1).png" title="JAckson Electronic logo" class="logo">
            <h1>Registration Form</h1>
        </div>
        <form action="" method="post">
            <table>
                <caption>egister your Jackson Electronics product here</caption>
                <tr>
                    <td style="width: 100px">First Name:</td>

                    <td colspan="2" style="text-align:right">
                        <input type="text" >
                        &nbsp;Last Name:&nbsp;
                        <input type="text" >
                    </td>
                </tr>
                <tr>
                    <td>Address #1:</td>
                    <td style="padding-left: 52px" colspan="2">
                        <input type="text" name="address1" size="35">
                    </td>  
                </tr>
                <tr>
                    <td>Address #2:</td>
                    <td style="padding-left: 52px" colspan="2">
                        <input type="text" name="address2" size="35">
                    </td>  
                </tr>
                <tr>
                    <td>City</td>
                    <td colspan="2" style="text-align:right;">
                        <input type="text" size="28">
                        &nbsp;State:&nbsp;
                        <input type="text" size="3">
                        &nbsp;Zip:&nbsp;
                        <input type="text" size="3">
                    </td>
                </tr>
                <tr>
                    <td >Country:</td>
                    <td colspan="2" style="padding-left: 52px">
                        <input type="text" name="Country" size="28" placeholder="United States">
                    </td>
                </tr>
            </table>
            <hr>
            <table>
                <tr>
                    <td style="width: 100px">Product</td>
                    <td colspan="2" style="padding-left: 52px">
                        <select>
                            <option>ScanMaster</option>
                            <option>Computer</option>
                            <option>Phone</option>
                            <option>Printer</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Date Purchased:</td>
                    <td colspan="2" style="padding-left: 52px">
                        <input type="text" name="Country" size="28">
                    </td>
                </tr>
                <tr>
                    <td>Serial#:</td>
                    <td colspan="2" style="padding-left: 52px">
                        <input type="text" name="Country" size="28">
                    </td>
                </tr>
                <tr>
                    <td>Used for</td>
                    <td colspan="2" style="padding-left: 52px">
                        <input type="radio" id="home" name="usefor">
                            <label for="home">Home</label>
                        <input type="radio" id="Educational" name="usefor">
                            <label for="Educational">Educational Institution</label>
                        <br>
                        <input type="radio" id="Business" name="usefor">
                            <label for="Business">Business</label>
                        <input type="radio" id="Other1" name="usefor">
                            <label for="Other1">Other</label>
                        <br>
                        <input type="radio" id="Gorvenment" name="usefor">
                            <label for="Gorvenment">Gorvenment</label>
                    </td>
                </tr>
                <tr>
                    <td>System(check all that apply)</td>
                    <td colpan="2" style="padding-left: 52px">
                        <input type="checkbox" id="Windows" name="system">
                            <label for="Windows">Windows</label>
                        <input type="checkbox" id="UNIX" name="system">
                            <label for="UNIX">UNIX</label>
                        <br>
                        <input type="checkbox" id="Macintosh" name="system">
                            <label for="Macintosh">Macintosh</label>
                        <input type="checkbox" id="Other" name="system">
                            <label for="Other">Other</label>
                    </td>
                </tr>
            </table>
            <hr>
            <table>
                <tr>
                    <td style="width: 100px">Comments?:</td>
                    <td colpan="2" style="padding-left: 52px">
                        <textarea></textarea>
                    </td>
                </tr>
            </table>
            <div class="container">
                <input type="submit" value="Click to register">
                <input type="reset" value="Click to cancel">
            </div>
        </form>
    </div>
    
    </body>
</html>

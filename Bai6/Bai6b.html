<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Contact Us</title>
        <style>
            .box{
                width: 1000px;
                border: 2px solid blue;
                padding: 10px;
                text-align: justify;
            }
        </style>
    </head>
    <body>
        <div class="box">
        <h1>Contact Us</h1>
        <form action="https://www.coursera.org" method="post">
            <fieldset>
                <legend>Your message:</legend>
                <table>
                    <tr>
                        <td>To</td>
                        <td>
                            <input type="text" name="to" placeholder="Example Cafe">
                        </td>
                    </tr>
                    <tr>
                        <td>Your email:</td>
                        <td>
                            <input type="email" name="mail" placeholder="ABC@gmail.com">
                        </td>
                    </tr>
                    <tr>
                        <td>Message</td>
                        <td>
                            <textarea name="comment"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>Attach File</td>
                        <td>
                            <input type="file" name="file">
                        </td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>How you found us:</legend>
                <table>
                    <tr>
                        <td>How did you hear of us</td>
                        <td>
                            <select name="where">
                                <option>Google</option>
                                <option>X(twitter)</option>
                                <option>Facebook</option>
                                <option>Telegram</option>
                                <option>微信/小红书</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Newsletter</td>
                        <td>
                            <input type="checkbox" id="ensure" name="ensure">
                            <label for="ensure">Ensure this box checked if you would like to receive email updates</label>
                        </td>
                    </tr>
                </table>
            </fieldset>
            <input type="submit" value="Send message">
        </form>
        </div>
    </body>
</html>
